name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - opencode
        # Keep this list in sync with BASE_IMAGES in the Makefile.
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - opensuse/leap:latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: make test-autogenerated FEATURE="${{ matrix.features }}" BASE_IMAGES="${{ matrix.baseImage }}"

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - opencode
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: make test-scenarios FEATURE="${{ matrix.features }}"
